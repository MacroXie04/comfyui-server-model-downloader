openapi: 3.1.0
info:
  title: Server Model Downloader API
  version: 1.0.0
  description: >-
    Same-origin API served by the ComfyUI process. Every operation requires the
    configured reverse-proxy identity. Mutating operations also require an
    identity-bound X-SMD-CSRF token and the configured HTTPS Origin.
servers:
  - url: /server-model-downloader
  - url: /api/server-model-downloader
security:
  - reverseProxyIdentity: []
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Downloader is ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503":
          description: >-
            Authenticated health document for a degraded worker, or the stable
            error envelope when configuration or authentication is unavailable.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Health"
                  - $ref: "#/components/schemas/Error"
  /session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Authenticated browser session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /inspect:
    post:
      operationId: inspectModels
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [models]
              properties:
                models:
                  type: array
                  maxItems: 50
                  items: { $ref: "#/components/schemas/WorkflowModel" }
      responses:
        "200":
          description: Server-resolved model metadata, including per-model failures.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InspectionEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }
  /jobs:
    get:
      operationId: listJobs
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Newest-first job page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobPage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      operationId: createJobs
      parameters:
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [download_tokens, license_confirmed]
              properties:
                download_tokens:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, minLength: 1 }
                license_confirmed: { const: true }
      responses:
        "202":
          description: Jobs accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobsEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /jobs/{job_id}:
    get:
      operationId: getJob
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /jobs/{job_id}/cancel:
    post:
      operationId: cancelJob
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "202":
          description: Cancellation was accepted and the updated job is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /jobs/{job_id}/partial:
    delete:
      operationId: discardPartial
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/Csrf"
        - $ref: "#/components/parameters/Origin"
      responses:
        "200":
          description: Updated job after safe partial removal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobEnvelope" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    reverseProxyIdentity:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: >-
        Supplied by Cloudflare Access. In trusted-proxy mode, the configured
        proxy-owned identity header is used instead and must not be client-set.
  parameters:
    Csrf:
      name: X-SMD-CSRF
      in: header
      required: true
      schema: { type: string, minLength: 1 }
    Origin:
      name: Origin
      in: header
      required: true
      description: Must exactly match SMD_PUBLIC_ORIGIN.
      schema: { type: string, format: uri, pattern: "^https://" }
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
  responses:
    Error:
      description: Stable error envelope.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [error, code, request_id]
      properties:
        error: { type: string }
        code: { type: string }
        request_id: { type: string, pattern: "^[a-f0-9]{32}$" }
    Health:
      type: object
      additionalProperties: false
      required: [api_version, extension_version, status, state]
      properties:
        api_version: { type: string, const: "1" }
        extension_version: { type: string, const: "1.0.0" }
        status: { enum: [ok, degraded] }
        state:
          enum: [ready, running, stopped, degraded, disabled, configuration-error]
        worker_running: { type: boolean }
        instance_lock_acquired: { type: boolean }
        queued_jobs: { type: integer, minimum: 0 }
        quarantined_state: { type: boolean }
        reason: { type: string }
    Session:
      type: object
      additionalProperties: false
      required:
        - api_version
        - extension_version
        - csrf_token
        - csrf_expires_at
        - allowed_directories
        - safe_extensions
        - capabilities
        - identity
      properties:
        api_version: { type: string, const: "1" }
        extension_version: { type: string, const: "1.0.0" }
        csrf_token: { type: string, minLength: 1 }
        csrf_expires_at:
          type: integer
          minimum: 0
          description: Unix epoch expiry in seconds.
        allowed_directories:
          type: array
          items: { $ref: "#/components/schemas/ModelDirectory" }
        safe_extensions:
          type: array
          items: { type: string, const: .safetensors }
        capabilities: { $ref: "#/components/schemas/Capabilities" }
        identity: { $ref: "#/components/schemas/Identity" }
    Capabilities:
      type: object
      additionalProperties: false
      required:
        - providers
        - resume
        - sha256
        - discard_partial
        - max_models_per_scan
        - single_process
      properties:
        providers:
          type: array
          items: { enum: [huggingface, civitai] }
        resume: { type: boolean }
        sha256: { type: boolean }
        discard_partial: { type: boolean }
        max_models_per_scan: { type: integer, const: 50 }
        single_process: { type: boolean }
    Identity:
      type: object
      additionalProperties: false
      required: [email, auth_mode]
      properties:
        email: { type: [string, "null"], format: email }
        auth_mode: { enum: [cloudflare-access, trusted-proxy] }
    ModelDirectory:
      enum:
        - checkpoints
        - diffusion_models
        - text_encoders
        - clip
        - clip_vision
        - vae
        - loras
        - controlnet
        - upscale_models
        - embeddings
        - audio_encoders
        - style_models
    WorkflowModel:
      type: object
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string, format: uri, pattern: "^https://" }
        directory:
          oneOf:
            - { const: auto }
            - { $ref: "#/components/schemas/ModelDirectory" }
    InspectionEnvelope:
      type: object
      additionalProperties: false
      required: [models]
      properties:
        models:
          type: array
          items: { $ref: "#/components/schemas/InspectedModel" }
    InspectedModel:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - filename
        - url
        - directory
        - installed
        - eligible
        - reason
        - source
        - download_token
      properties:
        id: { type: string, pattern: "^[a-f0-9]{24}$" }
        name: { type: string }
        filename: { type: string }
        url: { type: string }
        directory: { type: string }
        installed: { type: boolean }
        eligible: { type: boolean }
        reason: { type: string }
        source: { enum: ["", Hugging Face, Civitai] }
        download_token: { type: [string, "null"] }
        provider: { enum: [huggingface, civitai] }
        requested_name: { type: string }
        source_filename: { type: string }
        relative_path: { type: string }
        canonical_url: { type: string, format: uri, pattern: "^https://" }
        revision: { type: string }
        size: { type: integer, minimum: 1 }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        license: {}
        license_url: { type: [string, "null"], format: uri }
        metadata: { type: object }
        expires_at: { type: integer, minimum: 0 }
    Job:
      $ref: "./job.schema.json"
    JobsEnvelope:
      type: object
      additionalProperties: false
      required: [jobs]
      properties:
        jobs:
          type: array
          items: { $ref: "#/components/schemas/Job" }
    JobEnvelope:
      type: object
      additionalProperties: false
      required: [job]
      properties:
        job: { $ref: "#/components/schemas/Job" }
    JobPage:
      type: object
      additionalProperties: false
      required: [jobs, next_cursor]
      properties:
        jobs:
          type: array
          items: { $ref: "#/components/schemas/Job" }
        next_cursor: { type: [string, "null"] }
