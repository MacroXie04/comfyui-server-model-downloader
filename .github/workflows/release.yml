name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Validate release candidate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the immutable GitHub Release and its assets.
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["TAG"] != f"v{version}":
              raise SystemExit(f"tag {os.environ['TAG']} does not match project version {version}")
          PY
      - name: Require an annotated tag on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$(git cat-file -t "$TAG")" = tag
          test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build deterministic source archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          archive="server-model-downloader-${version}.zip"
          git archive --format=zip --prefix="server-model-downloader-${version}/" --output="$archive" "$GITHUB_SHA"
          sha256sum "$archive" > SHA256SUMS
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" server-model-downloader-*.zip SHA256SUMS --verify-tag --generate-notes --title "Server Model Downloader ${TAG}"

  publish-registry:
    name: Comfy Registry
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      # The official publish-node-action currently invokes mutable nested action
      # tags and an unpinned comfy-cli. These equivalent steps keep the Registry
      # protocol official while making the complete release toolchain immutable.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned Comfy CLI
        run: python -m pip install --disable-pip-version-check comfy-cli==1.16.0
      - name: Publish immutable Registry version
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          comfy --skip-prompt --no-enable-telemetry env
          comfy node publish --token "$REGISTRY_ACCESS_TOKEN"
